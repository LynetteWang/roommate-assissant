<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>合租生活管家</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <!-- Login View -->
  <template id="tpl-login">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">🏠</div>
          <h1>合租生活管家</h1>
          <p>让合租生活更和谐</p>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>
        <div class="auth-form" id="login-form">
          <div class="form-group">
            <label>手机号 / 邮箱</label>
            <input type="text" id="login-account" placeholder="请输入手机号或邮箱" maxlength="30">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" maxlength="20">
          </div>
          <button class="btn-primary btn-full" id="btn-login">登 录</button>
        </div>
        <div class="auth-form hidden" id="register-form">
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="reg-name" placeholder="你的称呼" maxlength="10">
          </div>
          <div class="form-group">
            <label>手机号 / 邮箱</label>
            <input type="text" id="reg-account" placeholder="用于登录" maxlength="30">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="设置密码" maxlength="20">
          </div>
          <button class="btn-primary btn-full" id="btn-register">注 册</button>
        </div>
        <p class="auth-hint">注册后需输入门牌号并确认舍友公约</p>
      </div>
    </div>
  </template>

  <!-- Door Number View -->
  <template id="tpl-door">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">🚪</div>
          <h1>确认你的门牌号</h1>
          <p>输入门牌号以验证舍友身份</p>
        </div>
        <div class="door-input-wrap">
          <input type="text" id="door-number" class="door-input" placeholder="如 302" maxlength="6">
        </div>
        <button class="btn-primary btn-full" id="btn-confirm-door">确认门牌号</button>
        <button class="btn-text btn-full" id="btn-skip-door">稍后再填</button>
      </div>
    </div>
  </template>

  <!-- Covenant Confirm View -->
  <template id="tpl-covenant-confirm">
    <div class="auth-page">
      <div class="auth-card covenant-confirm-card">
        <div class="auth-logo">
          <div class="logo-icon">📜</div>
          <h1>舍友公约</h1>
          <p>请仔细阅读并同意公约，才能进入应用</p>
        </div>
        <div class="covenant-content" id="covenant-preview"></div>
        <label class="checkbox-wrap">
          <input type="checkbox" id="agree-covenant">
          <span class="checkmark"></span>
          <span>我已阅读并同意以上舍友公约</span>
        </label>
        <button class="btn-primary btn-full" id="btn-agree-covenant" disabled>确认同意</button>
      </div>
    </div>
  </template>

  <!-- Main App Layout -->
  <template id="tpl-main">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon small">🏠</div>
          <span class="sidebar-title">合租生活管家</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#/dashboard" class="nav-item" data-route="dashboard">
            <span class="nav-icon">📊</span><span>首页</span>
          </a>
          <a href="#/bills" class="nav-item" data-route="bills">
            <span class="nav-icon">💰</span><span>账单AA</span>
          </a>
          <a href="#/cleaning" class="nav-item" data-route="cleaning">
            <span class="nav-icon">🧹</span><span>清洁排班</span>
          </a>
          <a href="#/covenant" class="nav-item" data-route="covenant">
            <span class="nav-icon">📜</span><span>舍友公约</span>
          </a>
          <a href="#/activities" class="nav-item" data-route="activities">
            <span class="nav-icon">🎉</span><span>活动申请</span>
          </a>
          <a href="#/lateReturn" class="nav-item" data-route="lateReturn">
            <span class="nav-icon">🌙</span><span>归家登记</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-card" id="sidebar-user"></div>
          <button class="btn-text" id="btn-logout">退出登录</button>
        </div>
      </aside>
      <main class="main-content" id="page-content"></main>
      <nav class="bottom-nav">
        <a href="#/dashboard" class="nav-item" data-route="dashboard"><span class="nav-icon">📊</span></a>
        <a href="#/bills" class="nav-item" data-route="bills"><span class="nav-icon">💰</span></a>
        <a href="#/cleaning" class="nav-item" data-route="cleaning"><span class="nav-icon">🧹</span></a>
        <a href="#/activities" class="nav-item" data-route="activities"><span class="nav-icon">🎉</span></a>
        <a href="#/lateReturn" class="nav-item" data-route="lateReturn"><span class="nav-icon">🌙</span></a>
      </nav>
    </div>
  </template>

  <!-- Dashboard Page -->
  <template id="tpl-dashboard">
    <div class="page">
      <header class="page-header">
        <h1 id="dash-greeting">你好</h1>
        <span class="date-badge" id="dash-date"></span>
      </header>
      <div class="dash-grid">
        <div class="dash-card" id="dash-bills">
          <div class="dash-card-icon">💰</div>
          <div class="dash-card-info">
            <span class="dash-card-label">待付账单</span>
            <span class="dash-card-value" id="dash-bills-count">0 笔</span>
          </div>
        </div>
        <div class="dash-card" id="dash-cleaning">
          <div class="dash-card-icon">🧹</div>
          <div class="dash-card-info">
            <span class="dash-card-label">本周清洁</span>
            <span class="dash-card-value" id="dash-cleaning-info">--</span>
          </div>
        </div>
        <div class="dash-card" id="dash-activities">
          <div class="dash-card-icon">🎉</div>
          <div class="dash-card-info">
            <span class="dash-card-label">进行中活动</span>
            <span class="dash-card-value" id="dash-activities-count">0 个</span>
          </div>
        </div>
        <div class="dash-card" id="dash-late">
          <div class="dash-card-icon">🌙</div>
          <div class="dash-card-info">
            <span class="dash-card-label">近期晚归</span>
            <span class="dash-card-value" id="dash-late-count">0 条</span>
          </div>
        </div>
      </div>
      <div class="dash-section">
        <h2>🏠 舍友状态</h2>
        <div class="roommate-list" id="dash-roommates"></div>
      </div>
      <div class="dash-section">
        <h2>📋 待办事项</h2>
        <div class="todo-list" id="dash-todos"></div>
      </div>
    </div>
  </template>

  <!-- Bills Page -->
  <template id="tpl-bills">
    <div class="page">
      <header class="page-header">
        <h1>账单 AA</h1>
        <button class="btn-primary btn-sm" id="btn-new-bill">+ 新建账单</button>
      </header>
      <div class="tabs">
        <button class="tab active" data-bill-tab="all">全部</button>
        <button class="tab" data-bill-tab="pending">待付</button>
        <button class="tab" data-bill-tab="paid">已结清</button>
        <button class="tab" data-bill-tab="created">我发起的</button>
      </div>
      <div class="bill-list" id="bill-list"></div>
    </div>
  </template>

  <!-- Cleaning Page -->
  <template id="tpl-cleaning">
    <div class="page">
      <header class="page-header">
        <h1>清洁排班</h1>
        <button class="btn-primary btn-sm" id="btn-edit-schedule">编辑排班</button>
      </header>
      <div class="cleaning-week-nav">
        <button class="btn-icon" id="prev-week">‹</button>
        <span id="week-range" class="week-label">--</span>
        <button class="btn-icon" id="next-week">›</button>
      </div>
      <div class="cleaning-schedule" id="cleaning-schedule"></div>
      <div class="cleaning-tasks-section">
        <h2>本周清洁任务清单</h2>
        <div class="task-list" id="cleaning-tasks"></div>
      </div>
    </div>
  </template>

  <!-- Covenant Page -->
  <template id="tpl-covenant">
    <div class="page">
      <header class="page-header">
        <h1>舍友公约</h1>
        <button class="btn-primary btn-sm" id="btn-edit-covenant">编辑公约</button>
      </header>
      <div class="covenant-display" id="covenant-display"></div>
      <div class="covenant-signatures">
        <h2>签署状态</h2>
        <div class="signature-list" id="signature-list"></div>
      </div>
    </div>
  </template>

  <!-- Activities Page -->
  <template id="tpl-activities">
    <div class="page">
      <header class="page-header">
        <h1>活动申请</h1>
        <button class="btn-primary btn-sm" id="btn-new-activity">+ 发起活动</button>
      </header>
      <div class="tabs">
        <button class="tab active" data-act-tab="upcoming">即将进行</button>
        <button class="tab" data-act-tab="mine">我发起的</button>
        <button class="tab" data-act-tab="past">已结束</button>
      </div>
      <div class="activity-list" id="activity-list"></div>
    </div>
  </template>

  <!-- Late Return Page -->
  <template id="tpl-lateReturn">
    <div class="page">
      <header class="page-header">
        <h1>归家登记</h1>
        <button class="btn-primary btn-sm" id="btn-new-late">+ 晚归申请</button>
      </header>
      <div class="late-banner" id="late-banner"></div>
      <div class="tabs">
        <button class="tab active" data-late-tab="recent">近期</button>
        <button class="tab" data-late-tab="mine">我的</button>
      </div>
      <div class="late-list" id="late-list"></div>
    </div>
  </template>

  <!-- Modal Container -->
  <div id="modal-root"></div>
  <!-- Toast Container -->
  <div id="toast-root"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bills.js"></script>
  <script src="js/cleaning.js"></script>
  <script src="js/covenant.js"></script>
  <script src="js/activities.js"></script>
  <script src="js/lateReturn.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
